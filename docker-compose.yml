services:
  lpbot:
    build: .
    image: gridbot-lp:latest
    container_name: lpbot
    # The bot backs off internally on RPC failures; a restart here covers
    # process-level death (OOM, host reboot). It stays stopped after an
    # explicit `docker compose stop`.
    restart: unless-stopped

    # Secrets and endpoints come from .env — never baked into the image.
    env_file: [.env]

    environment:
      MODE: lp-live
      STATE_FILE: /app/state/position.json
      LP_SEED_FILE: /app/state/seed-5m.csv

      # --- safety: both must be set to broadcast -------------------------
      DRY_RUN: "${DRY_RUN:-true}"
      LIVE_CONFIRM: "${LIVE_CONFIRM:-}"

      # --- strategy ------------------------------------------------------
      LP_RANGE_PCT: "${LP_RANGE_PCT:-5}"
      LP_RECENTER_BUFFER_PCT: "${LP_RECENTER_BUFFER_PCT:-50}"
      LP_RECENTER_MIN_HOURS: "${LP_RECENTER_MIN_HOURS:-24}"
      LP_SLIPPAGE_BPS: "${LP_SLIPPAGE_BPS:-50}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-30}"

      # --- regime filter -------------------------------------------------
      # Off by default. Walk-forward loses money in 3 of 4 out-of-sample folds
      # without it; see docs/LP_REBALANCE.md before changing this.
      REGIME_MAX_MOVE_PCT: "${REGIME_MAX_MOVE_PCT:-3}"
      LP_REGIME_LOOKBACK_HOURS: "${LP_REGIME_LOOKBACK_HOURS:-168}"
      LP_REGIME_SAMPLE_MINUTES: "${LP_REGIME_SAMPLE_MINUTES:-60}"
      SEED_DAYS: "${SEED_DAYS:-30}"
      # Reuse a seed younger than this instead of re-downloading. Stops a
      # crash loop from hammering the data source on every restart.
      SEED_MAX_AGE_SECONDS: "${SEED_MAX_AGE_SECONDS:-3600}"

      # --- Aave lending of idle capital ----------------------------------
      # The regime filter stands aside most of the time; lending recovers
      # some of what that idleness costs. Everything is withdrawn before the
      # bot deploys, so lent assets are always available for LP.
      ENABLE_AAVE: "${ENABLE_AAVE:-false}"
      LEND_MIN_ACTION_USD: "${LEND_MIN_ACTION_USD:-100}"

      # --- short hedge: OFF ----------------------------------------------
      # Borrows WETH against collateral and sells it, to hold the parked book
      # flat against ETH. Off because it is the wrong tool for that job: while
      # parked the ETH is loose tokens that can simply be SOLD, which reaches
      # the same flat book without a borrow, a rate spread, or liquidation
      # risk. A borrow only earns its keep against exposure that cannot be
      # sold — the LP position's delta while deployed — which this does not
      # cover. Walk-forward also puts filter-plus-hedge (+0.2% mean) behind
      # the regime filter alone (+3.6%). See docs/LP_REBALANCE.md.
      HEDGE_ENABLED: "${HEDGE_ENABLED:-false}"
      HEDGE_RATIO_PCT: "${HEDGE_RATIO_PCT:-100}"
      HEDGE_MAX_LTV_PCT: "${HEDGE_MAX_LTV_PCT:-40}"
      HEDGE_MIN_HEALTH_FACTOR: "${HEDGE_MIN_HEALTH_FACTOR:-1.6}"

    volumes:
      # Position id, fee totals and the regime price window. Losing this means
      # losing track of the position and the whole fee measurement.
      - lpbot-state:/app/state

    # Logs go to the Docker daemon, readable with `docker compose logs -f`.
    # Capped so an unattended run cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    stop_grace_period: 30s

    # The lock file exists only while the bot holds it, so it doubles as a
    # liveness signal without adding an HTTP endpoint.
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/state/position.json.lock || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  lpbot-state:
